  #title-frame {
    position: absolute;
    left: 491px; top: 36px;
    width: 931px; height: 169px;
    border: 4px solid #068491;
    border-radius: 54px;
  }
  /* กล่องอุณหภูมิ: ในรูปที่ 1 ขยับขึ้นจาก 2.png ประมาณ 6px */
  #box1-cover {
    position: absolute;
    left: 298px; top: 228px;
    width: 275px; height: 270px;
    background: #fef6f3;
  }
  #box1 {
    position: absolute;
    left: 309px; top: 235px;
    width: 253px; height: 247px;
    border: 3px solid #068491;
    border-radius: 54px;
    background: #f5e0e0;
  }
  #box1-unit {
    position: absolute;
    left: 395px; top: 410px;
    width: 80px; height: 65px;
  }

  /* ---------- ตัวเลขค่าเซนเซอร์ ---------- */
  .value {
    position: absolute;
    width: 250px;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Inter", "Segoe UI", Arial, sans-serif;
    font-weight: 700;
    font-size: 104px;
    line-height: 1;
    color: #000;
    letter-spacing: 0;
    font-variant-numeric: tabular-nums;
  }
  #v-temp { left: 311px; top: 300px; }
  #v-humid { left: 665px; top: 300px; }
  #v-light { left: 1022px; top: 307px; }
  #v-water { left: 1382px; top: 307px; }

  /* ---------- Toggle ---------- */
  .toggle {
    position: absolute;
    width: 158px;
    height: 56px;
    border: 0;
    border-radius: 28px;
    background: #eecfd1;
    cursor: pointer;
    outline: none;
    touch-action: none;
    transition: background-color .25s ease;
  }
  .toggle .knob {
    position: absolute;
    left: -2px;
    top: -1px;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: #b09445;
    border: 5px solid #1f2a1a;
    transition: transform .25s ease;
  }
  .toggle.on { background: #8fcdd0; }
  .toggle.on .knob { transform: translateX(102px); }
  .toggle.dragging, .toggle.dragging .knob { transition: none; }
  .toggle:focus-visible { box-shadow: 0 0 0 4px rgba(7, 134, 148, .45); }

  #t-humid { left: 715px;  top: 647px; }
  #t-light { left: 1061px; top: 647px; }
  #t-water { left: 1447px; top: 647px; }

  <!-- ตัวเลข (สุ่มค่าใหม่ทุกครั้งที่โหลด และสุ่มต่อเนื่องเมื่อเปิด toggle) -->
  <div class="value" id="v-temp">--</div>
  <div class="value" id="v-humid">--</div>
  <div class="value" id="v-light">--</div>
  <div class="value" id="v-water">--</div>

  <!-- ปุ่ม toggle -->
  <button class="toggle" id="t-temp"  role="switch" aria-checked="false" aria-label="อุณหภูมิ"><span class="knob"></span></button>
  <button class="toggle" id="t-humid" role="switch" aria-checked="false" aria-label="ความชื้น"><span class="knob"></span></button>
  <button class="toggle" id="t-light" role="switch" aria-checked="false" aria-label="ค่าแสง"><span class="knob"></span></button>
  <button class="toggle" id="t-water" role="switch" aria-checked="false" aria-label="ระดับน้ำ"><span class="knob"></span></button>
</div>

<script>
(function () {
  /* ---------- 1) ปรับขนาดเวทีให้เต็มหน้าจอ (แบบ cover) ---------- */
  const stage = document.getElementById('stage');
  function fit() {
    const s = Math.max(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  /* ---------- 2) ตั้งค่าเซนเซอร์ + สุ่มค่า ---------- */
  const sensors = [
    { key: 'temp',  min: 20, max: 40  },  // °C
    { key: 'humid', min: 30, max: 90  },  // %
    { key: 'light', min: 50, max: 999 },  // cd
    { key: 'water', min: 1,  max: 50  }   // cm.
  ];
  const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;

  sensors.forEach(function (s) {
    s.valueEl  = document.getElementById('v-' + s.key);
    s.toggleEl = document.getElementById('t-' + s.key);
    s.timer = null;
    s.valueEl.textContent = rand(s.min, s.max);   // สุ่มค่าเริ่มต้น
  });

  /* ---------- 3) Toggle: คลิก / ลาก / ใช้คีย์บอร์ด ----------
     ON  = สุ่มค่าใหม่ต่อเนื่องทุก 1.5 วินาที (live)
     OFF = หยุดค่าไว้                                       */
  const TRACK = 158, KNOB = 56, TRAVEL = TRACK - KNOB;

  function setState(s, on) {
    s.toggleEl.classList.toggle('on', on);
    s.toggleEl.setAttribute('aria-checked', on ? 'true' : 'false');
    clearInterval(s.timer);
    if (on) {
      s.valueEl.textContent = rand(s.min, s.max);
      s.timer = setInterval(function () {
        s.valueEl.textContent = rand(s.min, s.max);
      }, 1500);
    }
  }

  sensors.forEach(function (s) {
    const el = s.toggleEl, knob = el.querySelector('.knob');
    let startX = 0, startLeft = 0, moved = false, active = false;

    el.addEventListener('pointerdown', function (e) {
      active = true; moved = false;
      startX = e.clientX;
      startLeft = el.classList.contains('on') ? TRAVEL : 0;
      el.setPointerCapture(e.pointerId);
    });

    el.addEventListener('pointermove', function (e) {
      if (!active) return;
      const scale = el.getBoundingClientRect().width / TRACK;   // ชดเชยการ scale ของเวที
      const dx = (e.clientX - startX) / scale;
      if (Math.abs(dx) > 4) moved = true;
      if (!moved) return;
      el.classList.add('dragging');
      const x = Math.min(TRAVEL, Math.max(0, startLeft + dx));
      knob.style.transform = 'translateX(' + x + 'px)';
    });

    function end(e) {
      if (!active) return;
      active = false;
      el.classList.remove('dragging');
      if (moved) {
        const x = parseFloat((knob.style.transform.match(/-?[\d.]+/) || [0])[0]);
        knob.style.transform = '';
        setState(s, x > TRAVEL / 2);
      } else {
        setState(s, !el.classList.contains('on'));   // คลิกธรรมดา
      }
    }
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);

    // คีย์บอร์ด: Space / Enter / ลูกศรซ้าย-ขวา
    el.addEventListener('keydown', function (e) {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setState(s, !el.classList.contains('on')); }
      if (e.key === 'ArrowRight') setState(s, true);
      if (e.key === 'ArrowLeft')  setState(s, false);
    });
  });
})();
</script>
</body>
</html>
